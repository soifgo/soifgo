```yaml
name: Sync GitHub to SourceForge

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SF_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan git.code.sf.net >> ~/.ssh/known_hosts

      - name: Test Connection
        run: |
          ssh -T -i ~/.ssh/id_ed25519 anyscan209@git.code.sf.net || true

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Add SourceForge Remote
        run: |
          git remote remove sourceforge || true
          git remote add sourceforge ssh://anyscan209@git.code.sf.net/p/soifgo/code

      - name: Push to SourceForge
        run: |
          git push sourceforge HEAD:main --force
```
