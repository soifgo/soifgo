<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robot Controller — SoifGo</title>
  <style>
    body {
      font-family: sans-serif;
      background: #111827;
      color: #f3f4f6;
      text-align: center;
      padding: 20px;
      margin: 0;
      touch-action: manipulation;
    }
    h1 { color: #60a5fa; font-size: 1.5rem; }
    .pad {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr 1fr;
      gap: 10px;
      max-width: 340px;
      margin: 20px auto;
    }
    .pad button {
      padding: 24px 0;
      border: none;
      border-radius: 12px;
      font-size: 1.6rem;
      font-weight: 700;
      color: white;
      background: #2563eb;
      cursor: pointer;
    }
    .pad .stop { background: #dc2626; }
    .pad button:active { transform: scale(0.95); }
    .empty { visibility: hidden; }
    .status {
      background: #1f2937;
      padding: 14px;
      border-radius: 10px;
      max-width: 320px;
      margin: 16px auto;
      font-size: 0.95rem;
      color: #facc15;
    }
  </style>
</head>
<body>

  <h1>🤖 Robot Controller</h1>

  <div class="pad">
    <button class="empty"></button>
    <button onclick="send('FWD')">↑</button>
    <button class="empty"></button>

    <button onclick="send('LEFT')">←</button>
    <button class="stop" onclick="send('STOP')">■</button>
    <button onclick="send('RIGHT')">→</button>

    <button class="empty"></button>
    <button onclick="send('BACK')">↓</button>
    <button class="empty"></button>
  </div>

  <div class="status" id="status">Ready.</div>

  <script>
    function send(cmd) {
      if (window.soifgo) {
        window.soifgo.CallSub('html_bluetooth_rx', true, cmd);
        document.getElementById('status').innerText = 'Sent: ' + cmd;
      }
    }
  </script>

</body>
</html>
